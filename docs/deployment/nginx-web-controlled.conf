server {
    listen 80;
    server_name demo.example.com;

    root /srv/survivor-demo/builds/web;
    index index.html;
    charset utf-8;
    etag on;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Range" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    if ($request_method = OPTIONS) {
        add_header Content-Length 0;
        add_header Content-Type "text/plain; charset=utf-8";
        return 204;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        gzip_static on;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
    }

    location ~* \.(js|pck)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
    }

    location ~* \.png$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }
}
